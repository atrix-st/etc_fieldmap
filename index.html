<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>기타수질 현장조사 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    #header {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      padding: 8px 12px; display: flex; align-items: center; gap: 8px;
    }
    #search { flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; font-size: 14px; outline: none; }
    #count-badge { font-size: 12px; font-weight: bold; color: #1976d2; white-space: nowrap; }
    #map { width: 100vw; height: 100vh; }

    /* 커스텀 핀 및 중복 숫자 마커 스타일 */
    .custom-marker {
      display: flex; align-items: center; justify-content: center;
      position: relative; cursor: pointer;
    }
    .marker-pin {
      width: 30px; height: 30px; border-radius: 50% 50% 50% 0;
      position: absolute; transform: rotate(-45deg); left: 50%; top: 50%;
      margin: -20px 0 0 -15px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      border: 2px solid #ffffff; transition: background-color 0.2s;
    }
    .pin-active { background-color: #1976d2; }
    .pin-done { background-color: #78909c; } /* 조사 완료 시 회색 */

    .marker-count {
      position: absolute; top: -16px; left: -1px; transform: translate(-50%, -50%);
      color: #ffffff; font-size: 12px; font-weight: bold; z-index: 10;
      text-align: center; width: 20px; line-height: 20px;
    }
    .marker-dot {
      width: 8px; height: 8px; background: white; border-radius: 50%;
      position: absolute; top: -16px; left: -1px; transform: translate(-50%, -50%); z-index: 10;
    }

    /* 팝업 스타일 */
    .popup-box { min-width: 220px; max-width: 280px; padding: 2px; }
    .item-card {
      border-bottom: 1px dashed #e0e0e0; padding-bottom: 10px; margin-bottom: 10px;
    }
    .item-card:last-child { border-bottom: none; padding-bottom: 2px; margin-bottom: 0; }
    
    .check-container {
      display: flex; align-items: center; justify-content: space-between;
      background: #f5f5f5; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px;
    }
    .check-label {
      display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .check-label input[type="checkbox"] {
      width: 17px; height: 17px; cursor: pointer; accent-color: #4caf50;
    }
    .done-tag { font-size: 11px; font-weight: bold; color: #4caf50; }
    .undone-tag { font-size: 11px; color: #888; }

    .popup-no { font-size: 11px; font-weight: 700; color: #0288d1; margin-bottom: 2px; }
    .popup-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; color: #111; }
    .popup-badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; }
    .badge-cat { background: #e3f2fd; color: #1976d2; }
    .badge-closed { background: #ffebee; color: #d32f2f; font-weight: bold; margin-left: 4px; }
    .popup-addr { font-size: 12px; color: #555; margin-bottom: 8px; line-height: 1.4; }
    
    .navi-btn-group { display: flex; flex-direction: column; gap: 5px; }
    .navi-btn {
      display: block; text-align: center; padding: 7px 0; border-radius: 5px;
      font-size: 12px; font-weight: bold; text-decoration: none; color: white;
    }
    .btn-kakao { background: #fee500; color: #181600; border: 1px solid #e2cb00; }
    .btn-tmap { background: #e61e2b; }
    .btn-naver { background: #03c75a; }
  </style>

  // 로컬 스토리지 완료 상태 관리
  function getCompletedList() {
    try {
      return JSON.parse(localStorage.getItem('survey_completed_list')) || [];
    } catch(e) {
      return [];
    }
  }

  function saveCompletedList(list) {
    localStorage.setItem('survey_completed_list', JSON.stringify(list));
  }

  // 동일 좌표(위/경도) 지점들을 하나로 묶기
  const locationGroups = {};
  rawData.forEach(item => {
    const key = `${item.lat}_${item.lng}`;
    if (!locationGroups[key]) {
      locationGroups[key] = {
        lat: item.lat,
        lng: item.lng,
        items: []
      };
    }
    locationGroups[key].items.push(item);
  });

  // 마커 아이콘 생성 (완료 여부 및 중복 수량 표시)
  function createMarkerIcon(isAllDone, count) {
    const pinClass = isAllDone ? 'pin-done' : 'pin-active';
    const innerHtml = count > 1 
      ? `<div class="marker-count">${count}</div>` 
      : `<div class="marker-dot"></div>`;

    return L.divIcon({
      className: 'custom-marker',
      html: `<div class="marker-pin ${pinClass}"></div>${innerHtml}`,
      iconSize: [30, 42],
      iconAnchor: [0, 10],
      popupAnchor: [0, -18]
    });
  }

  const markerEntries = [];

    const completedList = getCompletedList();
    let cardsHtml = '';

    group.items.forEach(item => {
