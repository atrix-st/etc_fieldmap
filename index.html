  const markerList = [];

  data.forEach((item) => {
    const encName = encodeURIComponent(item.name);
    const kakaoUrl = `kakaonavi://navigate?name=${encName}&x=${item.lng}&y=${item.lat}&coord_type=wgs84`;
    const tmapUrl = `tmap://route?goalname=${encName}&goalx=${item.lng}&goaly=${item.lat}`;
    const naverUrl = `nmap://navigation?dlat=${item.lat}&dlng=${item.lng}&dname=${encName}&appname=water-field`;

    // No. 라벨 생성
    const noText = item.no ? `<div class="popup-no">${item.no}</div>` : '';
    const statusBadge = item.status ? `<span class="popup-badge badge-closed">${item.status}</span>` : '';
    const catBadge = item.cat ? `<span class="popup-badge badge-cat">${item.cat}</span>` : '';

    const popupHtml = `
      <div class="popup-box">
        ${noText}
        <div class="popup-title">${item.name}</div>
        <div>${catBadge}${statusBadge}</div>
        <div class="popup-addr">${item.addr}</div>
        <div class="navi-btn-group">
          <a class="navi-btn btn-kakao" href="${kakaoUrl}">카카오내비 안내</a>
          <a class="navi-btn btn-tmap" href="${tmapUrl}">티맵 안내</a>
          <a class="navi-btn btn-naver" href="${naverUrl}">네이버 지도 안내</a>
        </div>
      </div>
    `;

    const marker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(popupHtml);
    markerList.push({ marker, item });
  });

  if (data.length > 0) {
    const group = new L.featureGroup(markerList.map(m => m.marker));
    map.fitBounds(group.getBounds().pad(0.1));
  }

  // 검색 필터 (No., 업소명, 주소, 업종 통합 검색)
  function filterMarkers() {
    const keyword = document.getElementById('search').value.toLowerCase().trim();
    let visibleCount = 0;
    markerList.forEach(({ marker, item }) => {
      const match = item.name.toLowerCase().includes(keyword) || 
                    item.addr.toLowerCase().includes(keyword) || 
                    item.cat.toLowerCase().includes(keyword) ||
                    (item.no && item.no.toLowerCase().includes(keyword));
      if (match) {
        if (!map.hasLayer(marker)) map.addLayer(marker);
        visibleCount++;
      } else {
        if (map.hasLayer(marker)) map.removeLayer(marker);
      }
    });
    document.getElementById('count-badge').textContent = `${visibleCount}개`;
  }
